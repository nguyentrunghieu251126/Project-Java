<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(${'Đơn hàng #' + donHang.maDonHang}, 'don-hang', ~{::main})}">
<body>
<main>
    <div class="thanh-hanh-dong">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/kho/don-hang}">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Danh sách đơn hàng</a>
        <span th:replace="~{admin/fragments :: nhan(${donHang.trangThai})}"></span>

        <!-- TV4: Nhân viên kho xử lý đơn (NVK03 – NVK06); nút chỉ hiện đúng trạng thái và đúng quyền -->
        <form th:if="${donHang.trangThai.name() == 'CHO_XAC_NHAN'}" sec:authorize="hasAuthority('DONHANG_XULY')"
              th:action="@{/admin/kho/don-hang/{ma}/xac-nhan(ma=${donHang.maDonHang})}" method="post" class="d-inline"
              onsubmit="return confirm('Xác nhận đơn hàng này?');">
            <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-check2" aria-hidden="true"></i> Xác nhận đơn</button>
        </form>
        <form th:if="${donHang.trangThai.name() == 'DA_XAC_NHAN'}" sec:authorize="hasAuthority('KHO_XUAT_HANG')"
              th:action="@{/admin/kho/don-hang/{ma}/xuat-kho(ma=${donHang.maDonHang})}" method="post"
              class="d-inline-flex gap-1" onsubmit="return confirm('Lập phiếu xuất kho cho đơn hàng này?');">
            <input type="text" name="ghiChu" maxlength="500" class="form-control form-control-sm" placeholder="Ghi chú (không bắt buộc)">
            <button type="submit" class="btn btn-sm btn-primary text-nowrap"><i class="bi bi-box-seam" aria-hidden="true"></i> Xuất kho</button>
        </form>
        <form th:if="${donHang.trangThai.name() == 'DA_XUAT_KHO'}" sec:authorize="hasAuthority('DONHANG_XULY')"
              th:action="@{/admin/kho/don-hang/{ma}/giao-hang(ma=${donHang.maDonHang})}" method="post" class="d-inline">
            <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-truck" aria-hidden="true"></i> Bắt đầu giao</button>
        </form>
        <form th:if="${donHang.trangThai.name() == 'DANG_GIAO'}" sec:authorize="hasAuthority('DONHANG_XULY')"
              th:action="@{/admin/kho/don-hang/{ma}/da-giao(ma=${donHang.maDonHang})}" method="post" class="d-inline"
              onsubmit="return confirm('Xác nhận khách đã nhận hàng?');">
            <button type="submit" class="btn btn-sm btn-success"><i class="bi bi-check2-circle" aria-hidden="true"></i> Đã giao</button>
        </form>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-lg-6">
            <section class="the h-100 mb-0">
                <div class="the-tieu-de"><h2>Giao hàng</h2></div>
                <dl class="bang-thong-tin">
                    <dt>Người nhận</dt><dd th:text="${donHang.hoTenNguoiNhan}"></dd>
                    <dt>Điện thoại</dt><dd th:text="${donHang.soDienThoaiNguoiNhan}"></dd>
                    <dt>Địa chỉ</dt><dd th:text="${donHang.diaChiGiaoHang}"></dd>
                </dl>
            </section>
        </div>
        <div class="col-lg-6">
            <section class="the h-100 mb-0">
                <div class="the-tieu-de"><h2>Thông tin đơn</h2></div>
                <dl class="bang-thong-tin">
                    <dt>Ngày đặt</dt><dd th:text="${#temporals.format(donHang.ngayDat, 'dd/MM/yyyy HH:mm')}"></dd>
                    <dt>Ngày giao</dt>
                    <dd th:text="${donHang.ngayGiao != null} ? ${#temporals.format(donHang.ngayGiao, 'dd/MM/yyyy HH:mm')} : 'Chưa giao'"></dd>
                    <dt>Khách hàng</dt><dd th:text="${donHang.taiKhoan.email}"></dd>
                    <dt>Khuyến mãi</dt>
                    <dd th:text="${donHang.khuyenMai != null} ? ${donHang.khuyenMai.maGiamGia} : 'Không dùng'"></dd>
                    <!-- TV4: thông tin phiếu xuất kho -->
                    <dt>Phiếu xuất</dt>
                    <dd th:text="${phieuXuat != null}
                        ? |Số ${phieuXuat.maPhieuXuat} – ${#temporals.format(phieuXuat.ngayXuat, 'dd/MM/yyyy HH:mm')} – ${phieuXuat.taiKhoan.hoTen}|
                        : 'Chưa xuất kho'"></dd>
                </dl>
            </section>
        </div>
    </div>

    <section class="the">
        <div class="the-tieu-de"><h2>Sản phẩm trong đơn</h2></div>
        <div class="table-responsive">
            <table class="table bang">
                <thead><tr><th>Sản phẩm</th><th class="so">Đơn giá</th><th class="so">Số lượng</th><th class="so">Thành tiền</th></tr></thead>
                <tbody>
                <tr th:each="c : ${dsChiTiet}">
                    <td>
                        <div class="sp-dong">
                            <!-- Ảnh lỗi hoặc chưa có thì giữ icon thay thế -->
                            <div class="anh-nho"><i class="bi bi-image" aria-hidden="true"></i>
                                <img th:if="${c.sanPham.hinhAnh}" th:src="@{${c.sanPham.hinhAnh}}" alt="" hidden
                                     onload="this.hidden = false; this.previousElementSibling.remove()" onerror="this.remove()">
                            </div>
                            <div><span class="ten-chinh" th:text="${c.sanPham.tenSanPham}"></span>
                                <span class="ten-phu" th:text="${c.sanPham.maModel}"></span></div>
                        </div>
                    </td>
                    <td class="so" th:text="|${#numbers.formatInteger(c.donGia, 1, 'POINT')} ₫|"></td>
                    <td class="so" th:text="${c.soLuong}"></td>
                    <td class="so" th:text="|${#numbers.formatInteger(c.thanhTien, 1, 'POINT')} ₫|"></td>
                </tr>
                </tbody>
                <tfoot>
                <tr th:if="${donHang.tienGiam.signum() > 0}">
                    <td colspan="3" class="so">Giảm giá</td>
                    <td class="so" th:text="|-${#numbers.formatInteger(donHang.tienGiam, 1, 'POINT')} ₫|"></td>
                </tr>
                <tr>
                    <td colspan="3" class="so">Tổng thanh toán</td>
                    <td class="so" th:text="|${#numbers.formatInteger(donHang.tongTien, 1, 'POINT')} ₫|"></td>
                </tr>
                </tfoot>
            </table>
        </div>
    </section>
</main>
</body>
</html>
