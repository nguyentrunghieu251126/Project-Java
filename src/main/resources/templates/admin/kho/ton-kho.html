<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{admin/layout :: layout('Tồn kho', 'ton-kho', ~{::main})}">
<body>
<main>
    <section class="the">
        <form class="bo-loc" method="get" th:action="@{/admin/kho/ton-kho}">
            <div class="o-loc-rong"><label for="tuKhoa">Tìm kiếm</label>
                <input class="form-control form-control-sm" id="tuKhoa" name="tuKhoa" th:value="${tuKhoa}"
                       placeholder="Tên sản phẩm hoặc mã model"></div>
            <div class="o-loc"><label for="maDanhMuc">Danh mục</label>
                <select class="form-select form-select-sm" id="maDanhMuc" name="maDanhMuc">
                    <option value="">Tất cả</option>
                    <option th:each="d : ${dsDanhMuc}" th:value="${d.maDanhMuc}" th:text="${d.tenDanhMuc}"
                            th:selected="${maDanhMuc == d.maDanhMuc}"></option>
                </select></div>
            <div class="o-loc"><label for="tinhTrang">Tình trạng</label>
                <select class="form-select form-select-sm" id="tinhTrang" name="tinhTrang">
                    <option value="">Tất cả</option>
                    <option th:each="t : ${dsTinhTrang}" th:value="${t.name()}" th:text="${t.nhan}"
                            th:selected="${tinhTrang == t}"></option>
                </select></div>
            <button class="btn btn-sm btn-outline-secondary" type="submit"><i class="bi bi-funnel" aria-hidden="true"></i> Lọc</button>
            <a class="btn btn-sm btn-link" th:href="@{/admin/kho/ton-kho}">Xóa lọc</a>
        </form>

        <div class="table-responsive" th:if="${trang.hasContent()}">
            <table class="table table-hover bang bang-ton-kho">
                <colgroup><col class="c-ten"><col class="c-danh-muc"><col class="c-ton"><col class="c-muc"><col class="c-gia-tri">
                    <col class="c-tinh-trang"><col sec:authorize="hasAnyAuthority('SANPHAM_SUA','KHO_YEUCAU_NHAP')" class="c-thao-tac"></colgroup>
                <thead><tr><th>Sản phẩm</th><th>Danh mục</th><th class="giua">Tồn</th><th class="giua">Mức tối thiểu</th>
                    <th class="giua">Giá trị tồn</th><th class="giua">Tình trạng</th>
                    <th class="giua" sec:authorize="hasAnyAuthority('SANPHAM_SUA','KHO_YEUCAU_NHAP')">Thao tác</th></tr></thead>
                <tbody>
                <tr th:each="s : ${trang.content}">
                    <td><span class="ten-chinh" th:text="${s.tenSanPham}"></span>
                        <span class="ten-phu" th:text="${s.maModel}"></span></td>
                    <td th:text="${s.danhMuc.tenDanhMuc}"></td>
                    <td class="giua so-lieu ten-chinh" th:text="${s.soLuong}"></td>
                    <td class="giua so-lieu" th:text="${s.mucTonToiThieu}"></td>
                    <td class="giua so-lieu" th:text="|${#numbers.formatInteger(s.giaTriTon, 1, 'POINT')} ₫|"></td>
                    <td class="giua"><span th:replace="~{admin/fragments :: nhan(${s.tinhTrangTonKho})}"></span></td>
                    <!-- Sản phẩm cảnh báo có ô nhập hàng; quản trị viên lập yêu cầu được duyệt luôn, nhân viên kho lập phiếu chờ duyệt; hàng vào kho khi lập phiếu nhập (TV4 – NVK10) -->
                    <td class="giua" sec:authorize="hasAnyAuthority('SANPHAM_SUA','KHO_YEUCAU_NHAP')">
                        <div class="nhom-nut">
                            <form sec:authorize="hasAuthority('KHO_YEUCAU_NHAP')" th:if="${s.tinhTrangTonKho.name() != 'DU'}"
                                  class="o-nhap-hang input-group" method="post"
                                  th:action="@{/admin/kho/ton-kho/{ma}/yeu-cau-nhap(ma=${s.maSanPham})}"
                                  th:attr="data-xac-nhan=${#authorization.expression('hasRole(''QUAN_TRI'')')}
                                      ? |Lập yêu cầu nhập ${s.tenSanPham} (duyệt luôn), hàng vào kho khi nhân viên kho lập phiếu nhập?| : null">
                                <input class="form-control" type="number" name="soLuong" min="1" required
                                       th:aria-label="|Số lượng cần nhập của ${s.tenSanPham}|"
                                       th:value="${s.mucTonToiThieu > s.soLuong} ? ${s.mucTonToiThieu - s.soLuong} : 1">
                                <button class="btn btn-chinh text-nowrap" type="submit">
                                    <i class="bi bi-box-arrow-in-down" aria-hidden="true"></i>
                                    <span th:text="${#authorization.expression('hasRole(''QUAN_TRI'')')} ? 'Yêu cầu nhập' : 'Lập phiếu'">Lập phiếu</span>
                                </button>
                            </form>
                            <a sec:authorize="hasAuthority('SANPHAM_SUA')" class="btn btn-sm btn-outline-secondary nut-vuong"
                               th:href="@{/admin/san-pham/{ma}/sua(ma=${s.maSanPham})}" title="Sửa mức tồn tối thiểu"
                               th:aria-label="|Sửa mức tồn của ${s.tenSanPham}|"><i class="bi bi-sliders" aria-hidden="true"></i></a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="bang-trong" th:unless="${trang.hasContent()}">Không tìm thấy sản phẩm phù hợp.</p>
        <nav th:replace="~{admin/fragments :: phan-trang(${trang})}"></nav>
    </section>
</main>
</body>
</html>
