<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout('Bảo hành', 'bao-hanh', ~{::main})}">
<body>
<main>
    <!-- TV4: Tiếp nhận và xử lý bảo hành (NVK11, NVK13) -->
    <section class="the">
        <div class="tien-trinh mb-3">
            <a class="chip-loc" th:classappend="${trangThai == null} ? 'active'" th:href="@{/admin/kho/bao-hanh}">Tất cả</a>
            <a class="chip-loc" th:each="t : ${dsTrangThai}" th:classappend="${trangThai == t} ? 'active'"
               th:href="@{/admin/kho/bao-hanh(trangThai=${t.name()})}">
                <span th:text="${t.nhan}"></span>
                <strong th:if="${t.name() == 'CHO_TIEP_NHAN'}" th:text="${soChoTiepNhan}"></strong>
            </a>
        </div>

        <div class="table-responsive" th:if="${trang.hasContent()}">
            <table class="table table-hover bang">
                <thead><tr><th>Mã</th><th>Ngày yêu cầu</th><th>Khách hàng</th><th>Sản phẩm</th>
                    <th>Mô tả lỗi</th><th>Trạng thái</th><th>Xử lý</th><th style="min-width: 260px"></th></tr></thead>
                <tbody>
                <tr th:each="p : ${trang.content}" th:with="ct=${p.chiTietDonHang}">
                    <td th:text="|#${p.maPhieuBaoHanh}|"></td>
                    <td th:text="${#temporals.format(p.ngayYeuCau, 'dd/MM/yyyy HH:mm')}"></td>
                    <td><span class="ten-chinh" th:text="${ct.donHang.taiKhoan.hoTen}"></span>
                        <a class="ten-phu" th:href="@{/admin/kho/don-hang/{ma}(ma=${ct.donHang.maDonHang})}"
                           th:text="|Đơn #${ct.donHang.maDonHang}|"></a></td>
                    <td><span class="ten-chinh" th:text="${ct.sanPham.tenSanPham}"></span>
                        <span class="ten-phu" th:text="${ct.sanPham.maModel}"></span></td>
                    <td th:text="${p.moTaLoi}"></td>
                    <td><span th:replace="~{admin/fragments :: nhan(${p.trangThai})}"></span></td>
                    <td><span class="ten-chinh" th:text="${p.nhanVien != null} ? ${p.nhanVien.hoTen} : '–'"></span>
                        <span class="ten-phu" th:if="${p.ketQuaXuLy != null}" th:text="${p.ketQuaXuLy}"></span></td>
                    <td>
                        <!-- Bước 1: còn chờ tiếp nhận -->
                        <th:block th:if="${p.trangThai.name() == 'CHO_TIEP_NHAN'}">
                            <form class="d-inline" method="post"
                                  th:action="@{/admin/kho/bao-hanh/{ma}/tiep-nhan(ma=${p.maPhieuBaoHanh})}">
                                <button class="btn btn-sm btn-chinh" type="submit">Tiếp nhận</button>
                            </form>
                            <details class="d-inline-block mt-1">
                                <summary class="btn btn-sm btn-outline-danger">Từ chối</summary>
                                <form class="d-flex gap-1 mt-1" method="post"
                                      th:action="@{/admin/kho/bao-hanh/{ma}/tu-choi(ma=${p.maPhieuBaoHanh})}"
                                      onsubmit="return confirm('Từ chối yêu cầu này?');">
                                    <input class="form-control form-control-sm" name="ketQua" maxlength="1000" required
                                           placeholder="Lý do từ chối">
                                    <button class="btn btn-sm btn-danger" type="submit">Gửi</button>
                                </form>
                            </details>
                        </th:block>
                        <!-- Bước 2: đã tiếp nhận, ghi kết quả để hoàn thành -->
                        <form th:if="${p.trangThai.name() == 'DANG_BAO_HANH'}" class="d-flex gap-1" method="post"
                              th:action="@{/admin/kho/bao-hanh/{ma}/hoan-thanh(ma=${p.maPhieuBaoHanh})}">
                            <input class="form-control form-control-sm" name="ketQua" maxlength="1000" required
                                   placeholder="Kết quả, ví dụ: đã thay linh kiện">
                            <button class="btn btn-sm btn-success text-nowrap" type="submit">Hoàn thành</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="bang-trong" th:unless="${trang.hasContent()}">Không có yêu cầu nào.</p>
        <nav th:replace="~{admin/fragments :: phan-trang(${trang})}"></nav>
    </section>
</main>
</body>
</html>
