<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(tieuDe, menu, noiDung)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tieuDe} + ' | Quản trị PDMJV'">Quản trị PDMJV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body class="admin">

<aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar" aria-label="Menu quản trị">
    <div class="sidebar-dau">
        <a th:href="@{/admin}" class="sidebar-logo">
            <img th:src="@{/images/header-banner/logo-footer.png}" alt="PDMJV - Điện máy &amp; Công nghệ">
        </a>
        <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas"
                data-bs-target="#sidebar" aria-label="Đóng menu"></button>
    </div>

    <!-- Mỗi mục chỉ hiện khi tài khoản có đúng quyền của trang đó -->
    <nav class="sidebar-menu">
        <a th:href="@{/admin}" th:classappend="${menu == 'tong-quan'} ? 'active'">
            <i class="bi bi-speedometer2" aria-hidden="true"></i> Tổng quan
        </a>

        <div sec:authorize="hasAnyAuthority('BAOCAO_DOANHTHU','BAOCAO_BANCHAY','BAOCAO_TONKHO')">
            <p class="nhom-menu">Báo cáo thống kê</p>
            <a sec:authorize="hasAuthority('BAOCAO_DOANHTHU')" th:href="@{/admin/bao-cao/doanh-thu}"
               th:classappend="${menu == 'bc-doanh-thu'} ? 'active'">
                <i class="bi bi-graph-up-arrow" aria-hidden="true"></i> Doanh thu
            </a>
            <a sec:authorize="hasAuthority('BAOCAO_BANCHAY')" th:href="@{/admin/bao-cao/ban-chay}"
               th:classappend="${menu == 'bc-ban-chay'} ? 'active'">
                <i class="bi bi-trophy" aria-hidden="true"></i> Sản phẩm bán chạy
            </a>
            <a sec:authorize="hasAuthority('BAOCAO_TONKHO')" th:href="@{/admin/bao-cao/ton-kho}"
               th:classappend="${menu == 'bc-ton-kho'} ? 'active'">
                <i class="bi bi-clipboard-data" aria-hidden="true"></i> Báo cáo tồn kho
            </a>
        </div>

        <div sec:authorize="hasAnyAuthority('SANPHAM_XEM','KHUYENMAI_XEM')">
            <p class="nhom-menu">Kinh doanh</p>
            <a sec:authorize="hasAuthority('SANPHAM_XEM')" th:href="@{/admin/san-pham}"
               th:classappend="${menu == 'san-pham'} ? 'active'">
                <i class="bi bi-box" aria-hidden="true"></i> Sản phẩm
            </a>
            <a sec:authorize="hasAuthority('KHUYENMAI_XEM')" th:href="@{/admin/khuyen-mai}"
               th:classappend="${menu == 'khuyen-mai'} ? 'active'">
                <i class="bi bi-ticket-perforated" aria-hidden="true"></i> Khuyến mãi
            </a>
        </div>

        <div sec:authorize="hasAnyAuthority('DONHANG_XEM_TATCA','KHO_XEM_TONKHO','KHO_DUYET_NHAP')">
            <p class="nhom-menu">Quản lý kho</p>
            <a sec:authorize="hasAuthority('DONHANG_XEM_TATCA')" th:href="@{/admin/kho/don-hang}"
               th:classappend="${menu == 'don-hang'} ? 'active'">
                <i class="bi bi-receipt" aria-hidden="true"></i> Đơn hàng
            </a>
            <a sec:authorize="hasAuthority('KHO_XEM_TONKHO')" th:href="@{/admin/kho/ton-kho}"
               th:classappend="${menu == 'ton-kho'} ? 'active'">
                <i class="bi bi-boxes" aria-hidden="true"></i> Tồn kho
            </a>
            <a sec:authorize="hasAuthority('KHO_DUYET_NHAP')" th:href="@{/admin/kho/yeu-cau-nhap}"
               th:classappend="${menu == 'yeu-cau-nhap'} ? 'active'">
                <i class="bi bi-clipboard-check" aria-hidden="true"></i> Yêu cầu nhập hàng
            </a>
        </div>

        <div sec:authorize="hasAnyAuthority('TAIKHOAN_XEM','PHANQUYEN_QUANLY')">
            <p class="nhom-menu">Hệ thống</p>
            <a sec:authorize="hasAuthority('TAIKHOAN_XEM')" th:href="@{/admin/tai-khoan}"
               th:classappend="${menu == 'tai-khoan'} ? 'active'">
                <i class="bi bi-people" aria-hidden="true"></i> Tài khoản
            </a>
            <a sec:authorize="hasAuthority('PHANQUYEN_QUANLY')" th:href="@{/admin/phan-quyen}"
               th:classappend="${menu == 'phan-quyen'} ? 'active'">
                <i class="bi bi-shield-lock" aria-hidden="true"></i> Phân quyền
            </a>
        </div>
    </nav>
</aside>

<div class="khung-chinh">
    <header class="thanh-tren">
        <button class="btn btn-mo-menu d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
                aria-controls="sidebar" aria-label="Mở menu">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <h1 th:text="${tieuDe}">Tiêu đề</h1>
        <div class="thanh-tren-phai">
            <a th:href="@{/}" class="lien-ket-cua-hang">
                <i class="bi bi-shop" aria-hidden="true"></i><span class="d-none d-md-inline"> Xem cửa hàng</span>
            </a>
            <span class="nguoi-dung d-none d-sm-inline">
                <i class="bi bi-person-circle" aria-hidden="true"></i> <span th:text="${hoTenNguoiDung}">Tên</span>
            </span>
            <form th:action="@{/dang-xuat}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Đăng xuất
                </button>
            </form>
        </div>
    </header>

    <div class="noi-dung">
        <div th:if="${thongBao}" class="alert alert-success" role="status">
            <i class="bi bi-check-circle" aria-hidden="true"></i> <span th:text="${thongBao}"></span>
        </div>
        <div th:if="${canhBao}" class="alert alert-warning" role="status">
            <i class="bi bi-exclamation-triangle" aria-hidden="true"></i> <span th:text="${canhBao}"></span>
        </div>
        <div th:if="${loi}" class="alert alert-danger" role="alert">
            <i class="bi bi-x-circle" aria-hidden="true"></i> <span th:text="${loi}"></span>
        </div>
        <main th:replace="${noiDung}"></main>
    </div>
</div>

<!-- Hộp xác nhận dùng chung cho mọi form có thuộc tính data-xac-nhan -->
<div class="modal fade" id="hopXacNhan" tabindex="-1" aria-labelledby="hopXacNhanTieuDe" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="hopXacNhanTieuDe">Xác nhận thao tác</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body" id="hopXacNhanNoiDung"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-danger" id="hopXacNhanDongY">Đồng ý</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/admin.js}"></script>
</body>
</html>
