<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout('Sản phẩm bán chạy', 'bc-ban-chay', ~{::main})}">
<body>
<main>
    <form class="bo-loc" method="get" th:action="@{/admin/bao-cao/ban-chay}">
        <div class="o-loc"><label for="tuNgay">Từ ngày</label>
            <input type="date" class="form-control form-control-sm" id="tuNgay" name="tuNgay" th:value="${tuNgay}"></div>
        <div class="o-loc"><label for="denNgay">Đến ngày</label>
            <input type="date" class="form-control form-control-sm" id="denNgay" name="denNgay" th:value="${denNgay}"></div>
        <div class="o-loc"><label for="maDanhMuc">Danh mục</label>
            <select class="form-select form-select-sm" id="maDanhMuc" name="maDanhMuc">
                <option value="">Tất cả</option>
                <option th:each="d : ${dsDanhMuc}" th:value="${d.maDanhMuc}" th:text="${d.tenDanhMuc}"
                        th:selected="${maDanhMuc == d.maDanhMuc}"></option>
            </select></div>
        <div class="o-loc"><label for="top">Số sản phẩm</label>
            <select class="form-select form-select-sm" id="top" name="top">
                <option th:each="n : ${ {5, 10, 20, 50} }" th:value="${n}" th:text="|Top ${n}|"
                        th:selected="${top == n}"></option>
            </select></div>
        <button class="btn btn-sm btn-chinh" type="submit">Xem báo cáo</button>
    </form>

    <section class="the">
        <div class="the-tieu-de">
            <h2 th:text="|Top ${top} sản phẩm bán chạy|"></h2>
            <span class="chu-thich">Chỉ tính đơn đã giao; doanh số là giá bán trước giảm giá đơn hàng</span>
        </div>
        <div class="table-responsive" th:if="${!dsBanChay.isEmpty()}">
            <table class="table bang">
                <thead><tr><th>#</th><th>Sản phẩm</th><th>Danh mục</th><th>Số lượng bán</th><th class="so">Doanh số</th></tr></thead>
                <tbody>
                <tr th:each="d, st : ${dsBanChay}">
                    <td th:text="${st.count}"></td>
                    <td><span class="ten-chinh" th:text="${d.sanPham.tenSanPham}"></span>
                        <span class="ten-phu" th:text="${d.sanPham.maModel}"></span></td>
                    <td th:text="${d.sanPham.tenDanhMuc}"></td>
                    <td>
                        <div class="thanh-so">
                            <div class="thanh-so-ray">
                                <div class="thanh-so-than" th:style="'width:' + ${d.phanTram} + '%'"></div>
                            </div>
                            <span th:text="${d.sanPham.soLuongBan}"></span>
                        </div>
                    </td>
                    <td class="so" th:text="|${#numbers.formatInteger(d.sanPham.doanhSo, 1, 'POINT')} ₫|"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="bang-trong" th:if="${dsBanChay.isEmpty()}">Không có sản phẩm nào được bán trong khoảng thời gian này.</p>
    </section>
</main>
</body>
</html>
