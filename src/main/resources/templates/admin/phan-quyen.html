<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout('Phân quyền theo chức năng', 'phan-quyen', ~{::main})}">
<body>
<main>
    <form class="the" method="post" th:action="@{/admin/phan-quyen}">
        <p class="chu-thich">Tick để cấp chức năng cho vai trò. Thay đổi áp dụng ngay cho cả người đang đăng nhập:
            menu tự ẩn và URL của chức năng bị thu hồi sẽ bị chặn.</p>
        <p class="chu-thich">Ô xám là quyền không áp dụng cho vai trò đó.</p>
        <table class="table bang bang-quyen">
            <thead>
            <tr>
                <th>Chức năng</th>
                <th class="o-chon" th:each="v : ${dsVaiTro}" th:text="${v.tenHienThi}"></th>
            </tr>
            </thead>
            <tbody th:each="nhom : ${quyenTheoNhom}">
            <tr class="nhom"><td th:colspan="${dsVaiTro.size() + 1}" th:text="${nhom.key}"></td></tr>
            <tr th:each="q : ${nhom.value}">
                <td><span th:text="${q.tenQuyen}"></span>
                    <span class="ten-phu" th:text="${q.maChucNang}"></span></td>
                <td class="o-chon" th:each="v : ${dsVaiTro}"
                    th:with="luonGiu=${v.tenVaiTro == vaiTroQuanTri and q.maChucNang == quyenKhongTheGo},
                             lyDoKhoa=${oBiKhoa[v.maVaiTro][q.maQuyen]}">
                    <input class="form-check-input" type="checkbox" name="cap"
                           th:value="|${v.maVaiTro}:${q.maQuyen}|"
                           th:checked="${luonGiu or (lyDoKhoa == null and daCap[v.maVaiTro].contains(q.maQuyen))}"
                           th:disabled="${luonGiu or lyDoKhoa != null}"
                           th:title="${luonGiu} ? 'Quản trị viên luôn giữ quyền này' : ${lyDoKhoa}"
                           th:aria-label="|${q.tenQuyen} cho ${v.tenHienThi}|">
                </td>
            </tr>
            </tbody>
        </table>
        <div class="thanh-luu">
            <span class="chu-thich">Ô bị khóa: quản trị viên luôn giữ quyền phân quyền để không tự khóa mình khỏi hệ thống.</span>
            <button class="btn btn-chinh" type="submit">Lưu phân quyền</button>
        </div>
    </form>
</main>
</body>
</html>
