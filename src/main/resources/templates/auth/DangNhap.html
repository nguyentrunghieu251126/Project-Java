<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | PDMJV - Điện máy & Công nghệ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" th:href="@{/css/style-index/style-index.css}">
    <link rel="stylesheet" th:href="@{/css/responsive/respon-index.css}">
    <link rel="stylesheet" th:href="@{/css/style-DangNhap/DangNhap.css}">
    <link rel="stylesheet" th:href="@{/css/responsive/respon-DangNhap.css}">

</head>
<body>

<main class="dang-nhap-page">
    <div class="container">
        <div class="dang-nhap-wrapper">

            <div class="dang-nhap-card">
                <!-- Phần logo -->
                <div class="dang-nhap-brand">
                    <img th:src="@{/images/header-banner/logo-header.png}" alt="PDMJV - Điện máy & Công nghệ" class="dang-nhap-logo">
                    <div class="brand-line"></div>
                </div>

                <!-- Nội dung -->
                <div class="dang-nhap-content">
                    <h1 class="dang-nhap-title">Đăng nhập</h1>
                    <p class="dang-nhap-subtitle">Chào mừng bạn quay trở lại hệ thống PDMJV</p>


                    <div th:if="${thongBaoDangKy}" class="thong-bao-dang-ky" role="status">
                        <span aria-hidden="true">✓</span>
                        <span th:text="${thongBaoDangKy}"></span>
                    </div>

                    <div th:if="${param.khoa != null}" class="alert alert-danger" role="alert">
                        Tài khoản của bạn đã bị khóa hoặc không còn tồn tại.
                    </div>

                    <div th:if="${thongBaoDoiMatKhau}"
                         class="thong-bao-dang-ky"
                         role="status">

                        <span aria-hidden="true">✓</span>

                        <span th:text="${thongBaoDoiMatKhau}"></span>
                    </div>

                    <form th:action="@{/dang-nhap}" method="post" class="dang-nhap-form"  id="dangNhapForm" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label">Email</label>
                            <input type="email" id="username" name="username" class="form-control" placeholder="Nhập email" autocomplete="username" maxlength="100" required>
                            <div id="loiEmail" class="invalid-feedback" role="alert"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Mật khẩu</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
                            <div id="loiMatKhau" class="invalid-feedback" role="alert"></div>
                        </div>
                        <div th:if="${thongBaoLoi}" class="alert alert-danger" role="alert" th:text="${thongBaoLoi}"></div>
                        <button type="submit" class="btn btn-dang-nhap">Đăng nhập</button>
                    </form>
                    <div class="dang-nhap-actions">
                        <a th:href="@{/quen-mat-khau}" class="link-phu">Quên mật khẩu?</a>
                    </div>
                    <p class="dang-ky-text">Chưa có tài khoản?
                        <a th:href="@{/dang-ky}">Đăng ký ngay</a>
                    </p>

                    <div class="quay-ve-trang-chu">
                        <a th:href="@{/}">← Quay về trang chủ
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<script th:src="@{/js/kiemTraDangNhap.js}"></script>
</body>

</html>
