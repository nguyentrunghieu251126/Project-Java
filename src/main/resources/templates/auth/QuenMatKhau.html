
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quên mật khẩu | PDMJV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" th:href="@{/css/style-index/style-index.css}">
    <link rel="stylesheet" th:href="@{/css/responsive/respon-index.css}">
    <link rel="stylesheet" th:href="@{/css/style-DangNhap/DangNhap.css}">
    <link rel="stylesheet" th:href="@{/css/responsive/respon-DangNhap.css}">
</head>

<body>

<main class="dang-nhap-page">
    <div class="container">
        <div class="dang-nhap-wrapper">
            <div class="dang-nhap-card">
                <div class="dang-nhap-brand">
                    <a th:href="@{/}">
                        <img th:src="@{/images/header-banner/logo-header.png}"
                             alt="PDMJV - Điện máy và Công nghệ"
                             class="dang-nhap-logo">
                    </a>

                    <div class="brand-line"></div>
                </div>

                <div class="dang-nhap-content">

                    <h1 class="dang-nhap-title">
                        Quên mật khẩu?
                    </h1>

                    <p class="dang-nhap-subtitle">
                        Nhập thông tin tài khoản để yêu cầu
                        đặt lại mật khẩu.
                    </p>

                    <div th:if="${thongBaoLoi}"
                         class="alert alert-danger"
                         role="alert"
                         th:text="${thongBaoLoi}">
                    </div>

                    <form th:action="@{/quen-mat-khau}"
                          th:object="${quenMatKhauForm}"
                          method="post"
                          class="dang-nhap-form"
                          id="quenMatKhauForm"
                          novalidate>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email đăng ký
                            </label>

                            <input type="email"
                                   id="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="Nhập email đã đăng ký"
                                   maxlength="100"
                                   autocomplete="email"
                                   required>

                            <div id="loiEmail"
                                 class="invalid-feedback"
                                 role="alert"
                                 th:text="${#fields.hasErrors('email') ? #fields.errors('email')[0] : ''}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="soDienThoai"
                                   class="form-label">
                                Số điện thoại đã đăng ký
                            </label>

                            <input type="tel"
                                   id="soDienThoai"
                                   th:field="*{soDienThoai}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('soDienThoai')} ? 'is-invalid' : ''"
                                   placeholder="Nhập số điện thoại"
                                   maxlength="15"
                                   inputmode="numeric"
                                   autocomplete="tel"
                                   required>

                            <div id="loiSoDienThoai"
                                 class="invalid-feedback"
                                 role="alert"
                                 th:text="${#fields.hasErrors('soDienThoai') ? #fields.errors('soDienThoai')[0] : ''}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="matKhauMoi"
                                   class="form-label">
                                Mật khẩu mới
                            </label>
                            <div class="quen-mat-khau-password-field">
                            <input type="password"
                                   id="matKhauMoi"
                                   name="matKhauMoi"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('matKhauMoi')} ? 'is-invalid' : ''"
                                   placeholder="Từ 8 đến 72 ký tự, không dấu"
                                   minlength="8"
                                   maxlength="72"
                                   autocomplete="new-password"
                                   required>
                                <button type="button"
                                        id="nutHienMatKhauMoi"
                                        class="quen-mat-khau-password-toggle"
                                        aria-label="Hiện mật khẩu"
                                        aria-pressed="false">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div id="loiMatKhauMoi"
                                 class="invalid-feedback"
                                 role="alert"
                                 th:text="${#fields.hasErrors('matKhauMoi') ? #fields.errors('matKhauMoi')[0] : ''}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="xacNhanMatKhau"
                                   class="form-label">
                                Xác nhận mật khẩu mới
                            </label>
                            <div class="quen-mat-khau-password-field">
                            <input type="password"
                                   id="xacNhanMatKhau"
                                   name="xacNhanMatKhau"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('xacNhanMatKhau')} ? 'is-invalid' : ''"
                                   placeholder="Nhập lại mật khẩu mới"
                                   minlength="8"
                                   maxlength="72"
                                   autocomplete="new-password"
                                   required>
                                <button type="button"
                                        id="nutHienXacNhanMatKhauMoi"
                                        class="quen-mat-khau-password-toggle"
                                        aria-label="Hiện mật khẩu"
                                        aria-pressed="false">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div id="loiXacNhanMatKhau"
                                 class="invalid-feedback"
                                 role="alert"
                                 th:text="${#fields.hasErrors('xacNhanMatKhau') ? #fields.errors('xacNhanMatKhau')[0] : ''}"></div>
                        </div>

                        <button type="submit"
                                class="btn btn-dang-nhap">
                            Đặt lại mật khẩu
                        </button>

                    </form>

                    <div class="quay-ve-trang-chu">
                        <a th:href="@{/dang-nhap}">
                            ← Quay lại đăng nhập
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/kiemTraQuenMatKhau.js}"></script>

</body>
</html>
